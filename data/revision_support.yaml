revision_proposal:
  ratio: 5
  pinion_teeth: 24
  wheel_teeth: 120
  pitch_mm: 3
  pulley_face_mm: 15
  motor_bearing_centres_mm: [41.5, 52.5]
  drum_bearing_centres_mm: [33.5, 48.5]
  belt_centre_z_mm: 67.5
  rope_height_range_mm: [28.5, 53.5]
  shaft_support_z_mm: [5, 77]
  frame_deck_z_mm: [75.5, 78.5]
  cells_series: 20
  supply_setpoint_v: 52
  motor_current_limit_a: 50
  rope_force_comparison_n: 3000
  motor_torque_comparison_nm: 18
  pretension_per_span_n: [700, 850, 1000, 1150]
  notes:
    - This is a revision proposal; the R1 CAD and candidate remain unchanged and rejected.
    - Force and torque comparisons deliberately exceed R1 observed maxima. Actual R2 load histories must replace them before adoption.
    - Shaft support at both ends requires an engineered base flange and deck/sidewall load path, not the old slender posts alone.
    - Supply moves beside the mechanism; guide/exit turn toward the side wall to avoid crossing the supply volume.
    - Deck and sidewall compliance, positive retention, bolts, pinion profile/belt rating, sealing and fatigue remain unqualified.
    - Twenty 3 V cells provide 60 V pack rating with 52 V nominal upstream storage. Individual-cell balance/protection is still required.
