assumptions:
  modulation_utilization: 0.78
  electrical_frequency_comparison_hz: 700
  ambient_max_c_for_ratings: 40
  input_capacitance_f: 0.003
  output_added_capacitance_f: 0.0008
  diode_resistance_ohm: 0.001
  diode_offset_v: 0.010
  notes:
    - Modulation utilization is the retained conservative DC-equivalent model bound; published typical modulation depth is a different quantity and is not substituted for it.
    - The 700 Hz comparison is carried as a provisional screen, not a sourced Pro frequency rating.
    - Clamp forward drop is approximated by 10 mV plus 1 milliohm times current; not a validated nonlinear characteristic.
    - Input capacitor is an additional proposal. Assigning all published clamp capacitance to output is an unverified allocation.
    - Clamp switching is averaged between hysteresis endpoints; actual ripple, switching delay, frequency and peaks require separate verification.
    - Clamp conduction loss is placed in the drive thermal node; separate board hotspot and OTP behavior are unvalidated.
