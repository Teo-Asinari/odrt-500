# R4 proposal: move the 20-cell TV bank from upstream of the one-way Regen Clamp onto the drive bus,
# so regeneration charges the bank instead of the dump. Evidence: docs/engineering/fast-motion-review.md.
proposal:
  topology: bidirectional
  basis: >-
    In R3 + C1 fast reversal the one-way clamp dumps 317 W of regeneration and the aged bank reaches
    the 30 V trip. With the bank on the drive bus the fast-motion study dumps 49 W and the aged
    fast reversal no longer trips. The supply stays one-way and the dump thresholds are unchanged; the overvoltage trip is lowered to 56 V (below).
  retained_from_r3: [5:1 belt, conducted motor heat path, 30 V undervoltage trip, controller C1]
  # Owner decision 2026-11-03: overvoltage trip lowered from 57 V so the Regen Clamp's 58 V rating keeps 2 V of margin.
  trip_v: 56
  trip_basis: >-
    Normal operation peaks at the 54.4 V dump level, so 56 V leaves about 1.6 V above normal use and 2 V
    below the Regen Clamp's 58 V maximum. Chosen instead of replacing the clamp with 80 V-class parts.
# Hardware functions this topology needs. Checked here from the simulated envelope where data allow.
functions:
  reverse_blocking:
    need: The bus reaches the 54.35-54.5 V dump and up to the 56 V trip, above the 52 V supply setpoint and the EPP-500-54 56 V adjustment maximum. The supply output must not be back-fed.
    proposal: Ideal-diode (MOSFET OR-ing) controller on the supply output. The model's one-way source assumes it.
    on_resistance_ohm: 0.005   # assumed MOSFET path; no part selected
  precharge:
    need: The bank is a near short at power-on. The drive must stay disabled until the bank is charged.
    # Owner decision 2026-11-03: start-up is direct supply charging (sequence A in reports/precharge.md).
    sequence: supply_cc
    proposal: >-
      The bank disconnect closes at power-on and the supply charges the bank through its own
      constant-current limit (about 24 s to drive enable with a fresh bank). No pre-charge resistor
      or bypass is used at start-up. The drive is enabled when the bank reaches the enable threshold.
      The 6.8 ohm pulse resistor remains, as the normally-closed service-discharge path only.
    depends_on: >-
      The EPP-500-54 must current-limit continuously into a capacitive load (constant current, not
      hiccup or shut-down). This is unverified. Normal R4 operation already relies on it, because the
      heavy and hold cases run the supply at its 9.6 A limit.
    fallback: Resistor pre-charge (sequence B, 120 s fresh) if constant-current mode is not confirmed.
    enable_threshold_v: 45
    charge_timeout_factor: 1.5   # drive stays disabled and a fault latches if the bank is not at the threshold by this x the expected time
  cell_voltage:
    need: The bank now sees the drive bus maximum. Series cells must stay under rating with imbalance.
    worst_cell_factor: 1.05    # assumed worst cell / mean cell voltage with passive balancing; no balancing design yet
  dump_monitor:
    need: With the bank on the bus, a failed dump no longer reaches the overvoltage trip (fresh bank peaks at 55.6 V). Detect it directly.
    proposal: Supervisor compares the shunt-measured dump current with commanded duty x bus V / R; latches a dump_fault trip.
    detection_s: 0.1        # condition must hold this long
    min_expected_a: 2       # below this, shunt offset and the duty ramp make the comparison unreliable; assumed
    measured_fraction: 0.5  # fault when measured < this x expected
    reset_s: 0.001          # timer decay when the condition clears
    backup_bus_v: 55.0      # also fault if the bus stays above this; 0.5 V over full duty, 1 V under the trip (normal use peaks ~54.4 V)
  ripple_current:
    need: Bank current now carries drive bus transients. Compared with the cell's 15 K-rise RMS current.
    note: Cycle-averaged current only. Drive PWM-frequency ripple is assumed to stay in the drive-bus capacitors; bus wiring inductance is not modelled.
open_items:
  - Verify the EPP-500-54 overload behaviour (constant current vs hiccup) into a capacitive load; it decides the pre-charge circuit.
  - Select the ideal-diode controller and pre-charge parts; add them to the electrical definition and cost allowances.
  - Bank wiring inductance, fusing and a bank-disconnect for service are not designed.
  - Cell balancing (passive or active) is not designed; the worst-cell factor is an assumption.
