# Electronics heat/power budget (A-024). Placeholders unless marked cited.
psu_efficiency: 0.90             # assumed for unsourced 500 W candidate (A-026)
drive_loss_fraction: 0.03        # drive losses as a fraction of processed power (placeholder)
drive_idle_w: 3.0
standby_w: 15.0                  # PSU no-load + controllers + fans between sets (placeholder)
cells_in_series: 22              # 22 x 2.7 V = 59.4 V >= 56 V dump threshold
small_cell_f: 50                 # cited cell
small_cell_esr_ohm: 0.020        # cited cell
large_cell_esr_ohm: 0.004        # target for a large-format cell
skin_area_m2: 0.6                # conservative exposed area of one unit; confirm against packaged geometry
skin_h_w_m2k: 5.0                # natural convection (placeholder)
fan_flow_m3_s: 0.015             # ~32 CFM through the compartment
room_c: 25
limits_c: {psu: 60, capacitors: 65, load_cell: 55}   # cited operating maxima (PSU derates before 60 C)
current_density_a_mm2: 6.0       # continuous conductor sizing rule of thumb (placeholder)
drive_continuous_a: 40           # cited ODrive S1 (with heat spreader)
