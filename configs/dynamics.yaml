# Time-domain cable/drum/controller/bus model with fault injection (R-04, R-06, R-09).
# Every number here is a placeholder (A-016). Safety values are PROPOSALS to be
# reviewed (A-017): the brief forbids inventing validated safety thresholds.
designs: ["cubemars_ro100_kv55@6:1", "2x cubemars_ro100_kv55@6:1"]  # one motor per unit first; 2x is two motors on ONE drum, not the ADR-002 pair
dt_s: 0.0002
cable:
  axial_stiffness_ea_n: 500000   # EA of a ~4 mm synthetic rope, placeholder
  routing_length_m: 1.0          # cable between drum and the handle exit at zero payout
  damping_ratio: 0.05
friction_at_cable_n: 10          # Coulomb friction (drum bearings, seals, pulleys), placeholder
friction_smoothing_m_s: 0.005
current_loop_time_constant_s: 0.001
handle_mass_kg: 0.5              # handle mass once the user lets go
user:                            # arm surrogate: anticipates the set tension, impedance around the planned path
  mass_kg: 3.0
  stiffness_n_per_m: 2000
  damping_n_s_per_m: 100
handle_end_stop_m: 0.0           # payout at which the handle hits the device
sensors:
  load_cell_delay_s: 0.002
  load_cell_noise_n: 5
  encoder_delay_s: 0.001
  seed: 1
controller:
  kp: 0.2                        # N of correction per N of tension error (from gain sweep)
  ki_per_s: 5
  integral_limit_n: 500
  friction_feedforward: true
  inertia_compensation: 0.9      # fraction of m_eq * a_measured fed forward
  accel_filter_s: 0.005          # low-pass on differentiated encoder speed
  accel_clip_m_s2: 20            # inertia feedforward ignores accelerations beyond this (snap spikes)
safety:
  max_retract_speed_m_s: 1.0
  retract_speed_gain_n_per_m_s: 3000
  disagreement_n: 600
  disagreement_time_s: 0.02
  release_fraction: 0.2           # tension below this fraction of command ...
  release_time_s: 0.02           # ... for this long latches release: command drops to rest tension
  rest_tension_n: 22
  release_accel_fraction: 0.5      # release = low tension AND drum accelerating inward at > this x target/m_eq
  sensor_fault_ramp_s: 2.0         # on a sensor fault, hold the load on feedforward and ramp it down
independent:                       # separate safety MCU with its own sensing -> STO + phase short (proposal)
  watchdog_s: 0.05
  payout_fault_speed_m_s: 0.5      # drum paying out this fast while tension is low ...
  payout_fault_time_s: 0.03        # ... for this long trips STO
  reverse_drive_n: 100             # while the motor current drives cable out harder than this (wrong sign)
  brake_n_s_per_m: 2500            # STO / power-loss relay shorts phases through resistors: drum force = c * v
bus:
  nominal_v: 48
  capacitance_f: 2.0            # supercapacitor buffer (ADR-001); 500 W per unit + 2 F; ideal buffer, ESR checked separately
  supply_max_w: 500
  undervoltage_v: 40             # drive inhibits torque below this
  overvoltage_v: 60
  dump_on_v: 56
  dump_resistor_ohm: 0.5

cases:
  - {name: tracking_heavy_tempo, scenario: heavy_tempo_limit, window_s: 11.0, fault: none}
  - {name: tracking_heavy_full_set, scenario: heavy_tempo_limit, window_s: 25.7, fault: none}
  - {name: tracking_low_force, scenario: low_force_limit, window_s: 7.0, fault: none}
  - {name: tracking_fast_reversal, scenario: fast_reversal_limit, window_s: 4.0, fault: none}
  - {name: release_at_peak, scenario: heavy_tempo_limit, window_s: 4.0, fault: handle_release, fault_time_s: 2.6, safety: false}
  - {name: release_at_peak_speed_limit, scenario: heavy_tempo_limit, window_s: 4.0, fault: handle_release, fault_time_s: 2.6, safety: true}
  - {name: load_cell_stuck_zero, scenario: heavy_tempo_limit, window_s: 3.5, fault: load_cell_zero, fault_time_s: 2.6, safety: false}
  - {name: load_cell_stuck_zero_monitored, scenario: heavy_tempo_limit, window_s: 3.5, fault: load_cell_zero, fault_time_s: 2.6, safety: true}
  - {name: power_loss_open_mid_pull, scenario: heavy_tempo_limit, window_s: 3.0, fault: power_loss_open, fault_time_s: 1.8, independent: false}
  - {name: power_loss_braked_mid_pull, scenario: heavy_tempo_limit, window_s: 3.0, fault: power_loss_braked, fault_time_s: 1.8, independent: false}
  - {name: power_loss_shorted_mid_pull, scenario: heavy_tempo_limit, window_s: 3.0, fault: power_loss_shorted, fault_time_s: 1.8, independent: false}
  - {name: regen_no_dump_resistor, scenario: heavy_tempo_limit, window_s: 3.0, fault: no_dump_resistor, fault_time_s: 1.2}
  - {name: regen_with_dump_resistor, scenario: heavy_tempo_limit, window_s: 3.0, fault: none}
  - {name: torque_frozen_end_of_set, scenario: heavy_tempo_limit, window_s: 27.0, fault: torque_frozen, fault_time_s: 22.0, independent: false}
  - {name: torque_frozen_watchdog, scenario: heavy_tempo_limit, window_s: 27.0, fault: torque_frozen, fault_time_s: 22.0}
  - {name: torque_inverted_mid_pull, scenario: heavy_tempo_limit, window_s: 3.5, fault: torque_inverted, fault_time_s: 1.8, independent: false}
  - {name: torque_inverted_sto, scenario: heavy_tempo_limit, window_s: 3.5, fault: torque_inverted, fault_time_s: 1.8}
  - {name: encoder_loss_mid_set, scenario: heavy_tempo_limit, window_s: 8.0, fault: encoder_loss, fault_time_s: 1.8}
  - {name: deck_empty_pull, scenario: heavy_tempo_limit, window_s: 4.0, fault: deck_empty, fault_time_s: 0.0, safety: false}
  - {name: deck_empty_pull_presence, scenario: heavy_tempo_limit, window_s: 4.0, fault: deck_empty, fault_time_s: 0.0}
