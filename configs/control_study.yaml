# Controller study on the R3 machine. Control-config changes only; not adopted.
purpose: >-
  Fast reversal is not current- or voltage-limited in R3; its error is control dynamics (about 13 kg
  of reflected inertia at the rope, weak force feedback, feedforward on the scenario's planned rather
  than measured acceleration). This sweep tests how far gains alone go before model changes.
bank: r2_fresh
cases: [paired_release_asymmetric, single_fast_full, single_stroke_full, single_heavy_full, single_low_full, paired_release, left_torque_inverted, paired_asymmetric]
variants:
  reference: {}
  kp_0.5: {kp: 0.5}
  kp_1: {kp: 1.0}
  kp_2: {kp: 2.0}
  kp_4: {kp: 4.0}
  ff_1.0: {inertia_feedforward: 1.0}
  kp_1_ff_1.0: {kp: 1.0, inertia_feedforward: 1.0}
  kp_2_ki_20: {kp: 2.0, ki_s: 20}
  kp_2_fast_filter: {kp: 2.0, force_filter_s: 0.0005}
  measured_accel: {acceleration_blend: 1.0}
  kp_2_measured_accel: {kp: 2.0, acceleration_blend: 1.0}
  kp_4_measured_accel: {kp: 4.0, acceleration_blend: 1.0}
  kp_2_measured_ff1: {kp: 2.0, acceleration_blend: 1.0, inertia_feedforward: 1.0}
  end_zone_0.1_300: {end_zone_m: 0.1, end_zone_gain_n_s_m: 300}
  end_zone_0.15_600: {end_zone_m: 0.15, end_zone_gain_n_s_m: 600}
  kp_4_measured_end_zone: {kp: 4.0, acceleration_blend: 1.0, end_zone_m: 0.15, end_zone_gain_n_s_m: 600}
  kp_4_retract_2.0: {kp: 4.0, retract_speed_limit_m_s: 2.0}
  kp_4_retract_2.5: {kp: 4.0, retract_speed_limit_m_s: 2.5}
  kp_4_measured_retract_2.5: {kp: 4.0, acceleration_blend: 1.0, retract_speed_limit_m_s: 2.5}
  kp_4_retract_2.5_end_zone: {kp: 4.0, retract_speed_limit_m_s: 2.5, end_zone_m: 0.15, end_zone_gain_n_s_m: 600}
# Variant carried into the full-suite R3 run (make r3c-candidate). Not adopted until that run is reviewed.
proposed: kp_4_retract_2.5_end_zone
notes:
  - Sensor noise and quantization are not modelled; higher gains will look better here than on hardware.
  - Stability margins are judged only by these time-domain cases; no loop-shaping or robustness analysis yet.
  - Measured acceleration is the derivative of the filtered encoder speed; after an encoder fault it is driven by the zeroed encoder reading. End-zone braking is added to the command, so tracking is judged against the braked command.
  - Release, inverted-torque and asymmetric cases are included to catch gains that destabilize fault response.
