# Assumptions / uncertainty register. Every scenario and result cites the
# assumptions it depends on. Retire or revise entries rather than deleting them.
assumptions:
  - id: A-001
    statement: Cable motion is modeled as a one-dimensional trajectory at the drum exit. No user biomechanics, routing pulleys or cable angle are modeled.
    basis: WP1 scope in docs/DESIGN.md section 8. These are abstract test inputs, not exercise prescriptions.
    confidence: high
    status: accepted
    affects: [R-04, R-05, R-07]
  - id: A-002
    statement: Each extension and retraction follows a minimum-jerk position profile (peak speed 1.875 x stroke / duration).
    basis: Common smooth-motion idealisation. Real human pulls are less smooth and often asymmetric, which raises peak acceleration and power.
    confidence: low
    status: open
    affects: [R-02, R-04, R-06, R-07]
  - id: A-003
    statement: The tension setpoint is constant within each phase and changes as a linear ramp over tension_ramp_s. No variable-resistance curve along the stroke.
    basis: Simplest setpoint for duty-cycle sizing. How well the actuator tracks that setpoint is WP2.
    confidence: medium
    status: open
    affects: [R-03, R-04, R-07]
  - id: A-004
    statement: Between sets the cable is held at rest_tension_lbf (placeholder 5 lbf) to stay taut. Top and bottom holds keep the extension tension.
    basis: Placeholder. Low-force behaviour is an open question (R-03).
    confidence: low
    status: open
    affects: [R-03, R-07]
  - id: A-005
    statement: Reference scenario strokes, speeds, loads, rep counts and rest periods are engineering guesses for illustrative movements.
    basis: Not validated against measured cable data. Replace with measured or cited values when available.
    confidence: low
    status: open
    affects: [R-02, R-05, R-07]
  - id: A-006
    statement: RMS cable tension is reported as a proxy for motor copper-loss heating (I^2 R). The proxy assumes constant effective drum radius and torque constant.
    basis: Torque is proportional to current below saturation. Winding-layer radius change and saturation are ignored until WP2.
    confidence: medium
    status: open
    affects: [R-07]
  - id: A-007
    statement: Peak tension (500 lbf) is only needed at heavy-lift tempos, taken as peak concentric cable speed <= 0.95 m/s (mean ~0.3 m/s). Faster movements need less force.
    basis: User intent (2026-11-02) that 500 lbf is a human maximum at normal lift tempos. At 1RM, Conceicao et al. measured mean propulsive / peak velocity of 0.21/0.63 (leg press), 0.29/0.89 (full squat) and 0.33/0.95 m/s (half squat). Source https://cifi2d.fade.up.pt/files/movement-velocity-as-a-measure-of-exercise-intensity-in-three-lower-limb-exercises.pdf (accessed 2026-11-02). Barbell velocity, not cable velocity; upper-body lifts not yet sourced.
    confidence: medium
    status: open
    affects: [R-01, R-02, R-06]
  - id: A-008
    statement: The three drivetrain architectures in configs/architectures.yaml use illustrative placeholder parameters (ratio, efficiency, drum, inertia, motor constant), not catalog parts.
    basis: WP2 baseline compares how the architectures scale under the same duty cycles. WP3 replaces every value with cited supplier data.
    confidence: low
    status: open
    affects: [R-01, R-02, R-04, R-06, R-07, R-11]
  - id: A-009
    statement: The drivetrain is rigid and lumped. No cable compliance, backlash, torque ripple, control loop or sensor error. Gear efficiency is constant and the same in both directions, the inertia path is lossless, and the dr/dt term of a changing drum radius is ignored.
    basis: Simplest model that conserves energy. Compliance, backlash, ripple and control come in the dynamic model (R-04).
    confidence: medium
    status: open
    affects: [R-04, R-06, R-07]
  - id: A-010
    statement: Motor loss is copper loss only, (torque / Km)^2, with Km derated for winding temperature. Iron, drive, PSU and fan losses are neglected, and Km is constant (no magnetic saturation).
    basis: Copper loss dominates at high torque and low speed, which is the heavy-load case. Iron and drive losses grow with speed and are needed before power-supply sizing.
    confidence: medium
    status: open
    affects: [R-06, R-07]
  - id: A-011
    statement: Drum layers stack at a full cable-diameter pitch, the effective radius is at the cable centreline, and the cable pays off the outermost occupied layer.
    basis: Simple, conservative (largest radius) layer model. Real layers nest and cross over.
    confidence: medium
    status: open
    affects: [R-05, R-08]
  - id: A-012
    statement: The worst 60 s moving-window RMS motor torque and copper loss stand in for a winding thermal model.
    basis: Placeholder until the thermal network (R-07) exists. Real winding and housing time constants decide the right window.
    confidence: low
    status: open
    affects: [R-07]
  - id: A-013
    statement: Component study uses placeholder gear efficiencies (0.95 for an external single stage, 0.90 for an integrated actuator gearbox) and reuses architecture B's drum.
    basis: Vendor efficiency data not yet sourced. Real efficiency varies with load, speed and lubrication, and is lower when back-driven.
    confidence: low
    status: open
    affects: [R-01, R-02, R-06]
  - id: A-014
    statement: Copper loss uses Km = Kt / sqrt(1.5 R) for phase-amplitude Kt with phase-neutral R (ODrive convention), and Km = Kt / sqrt(R) for phase-phase R. Where the vendor convention is unclear, the result may be off by a factor of about 1.5 in loss.
    basis: Datasheet conventions vary and are often unstated (A-010).
    confidence: low
    status: open
    affects: [R-06, R-07]
  - id: A-015
    statement: Motor thermal model is two nodes (winding, housing) with total resistance backed out from rated continuous torque at a 120 C winding limit, heat capacity from total mass x 460 J/kg/K, and fixed 30/70 splits. Natural convection only; no fan; motors start cold.
    basis: No cited source gives thermal resistance, time constants or insulation class. Back-calculating from rated torque is standard but inherits the vendor's (unstated) rating conditions.
    confidence: low
    status: open
    affects: [R-01, R-02, R-07]
  - id: A-016
    statement: The dynamic model is 1-D with placeholder cable stiffness (EA 500 kN, 1 m routing), Coulomb friction (10 N), a 1 ms current loop, sensor delays and noise, and an arm surrogate (3 kg, 2000 N/m, 100 N*s/m) that anticipates the set tension. Shorted-phase braking neglects winding inductance, so it is an upper bound.
    basis: No measured cable, friction or human-arm data yet. The arm surrogate drives every user-side result (hand lurch, tracking) and is the least certain part.
    confidence: low
    status: open
    affects: [R-03, R-04, R-06, R-09]
  - id: A-017
    statement: The controller gains, retraction speed limit (1 m/s), load-cell disagreement monitor (600 N for 20 ms), braking resistor (0.5 ohm from 56 V) and 60 V overvoltage line are simulation-only proposals, not validated safety thresholds.
    basis: Gains come from a sweep over three tracking cases; the rest are round numbers. All need independent review (R-09, Gate D).
    confidence: low
    status: open
    affects: [R-04, R-06, R-09]
  - id: A-018
    statement: The concept layout (two-sided HTD-5M 15T/90T belt reduction, steel shaft, 6061 plates, generic bearing proportions) and structural sizing are hand-calculation placeholders. Belt pull is taken as twice the effective pull, every load is assumed to act in the same direction, and nothing has been checked against vendor belt or bearing ratings.
    basis: First-pass space claim and load path for WP4. Needs FEA, vendor data and independent mechanical review (R-08, Gate D).
    confidence: low
    status: open
    affects: [R-05, R-08, R-10, R-11]
  - id: A-019
    statement: Retail price is modelled as BOM x a single multiplier (2, 3 or 4) covering assembly, test, freight, tariffs, certification, warranty, returns, channel margin and overhead. The BOM uses one-off retail prices because no volume quotes exist.
    basis: Placeholder for the itemised cost model the brief requires (R-11, R-12). The multipliers are not sourced. Volume prices will be lower; the only volume price found (ODrive S1 at 100 units) is about 4% lower.
    confidence: low
    status: open
    affects: [R-11, R-12]
  - id: A-020
    statement: The presentation model (enclosure look, handle, tooth profiles, wound cable) and the mannequin animations are visual only. Mannequin proportions and exercise poses are rough keyframes timed by the scenario motion profiles; the device motion is derived from the hand path kinematically, with no forces.
    basis: For communication and layout review. It does not validate ergonomics, clearances under load or exercise technique.
    confidence: low
    status: open
    affects: [R-05, R-09]
