# WP5 preliminary hazard log (FMEA/STPA-style). Severity levels are PROPOSED
# qualitative categories for review, not validated ratings (A-017):
#   S1 nuisance, S2 minor injury possible, S3 serious injury possible, S4 severe/irreversible injury possible.
# `evidence` points at dynamic-model cases; the report fills in the numbers.
# `channel` says where a mitigation would live:
#   mechanical / independent-hardware / firmware / not-yet-defined.
# No human-loading experiment is authorized by this log.
hazards:
  - id: H-01
    title: Handle release under load (slingshot)
    cause: User lets go or the grip slips at high tension.
    effect: The cable's stored elastic energy (~F^2/2k) launches the handle toward the device. Separately, the controller can wind the drum hard into the end stop.
    severity: S4
    evidence: [{case: release_at_500lbf, metric: handle_end_stop_speed_m_s}, {case: release_at_500lbf_speed_limit, metric: handle_end_stop_speed_m_s}, {case: release_at_500lbf, metric: peak_tension_lbf}]
    mitigations: [Release detection drops command to rest tension (firmware, simulated), Retraction speed limiter (firmware, simulated), Mechanical handle arrestor or damper at the cable exit (mechanical, not designed), Stiffer cable to cut stored energy (mechanical, trade study needed)]
    channel: mechanical
    validation_gap: Firmware measures cannot remove the stored cable energy, so a mechanical arrestor is required and unmodelled. The arm surrogate and cable stiffness are placeholders.
    requirements: [R-08, R-09]
  - id: H-02
    title: Load cell fails low (stuck at zero)
    cause: Sensor, wiring or ADC fault.
    effect: Unmonitored, the PI loop drives tension above the command. Monitored, the fault also looks like a handle release, so the load drops and the user lurches.
    severity: S3
    evidence: [{case: load_cell_stuck_zero, metric: peak_tension_after_fault_lbf}, {case: load_cell_stuck_zero, metric: peak_hand_deviation_after_fault_m}, {case: load_cell_stuck_zero_monitored, metric: peak_hand_deviation_after_fault_m}]
    mitigations: [Load-cell vs motor-model disagreement monitor (firmware, simulated), Redundant tension sensing (independent-hardware, not designed), Ramp-down instead of drop on detected faults (firmware, not simulated)]
    channel: independent-hardware
    validation_gap: The disagreement monitor and the release detector conflict. A fault-handling policy that tells a sensor fault from a release is not yet defined.
    requirements: [R-09]
  - id: H-03
    title: Loss of mains power mid-pull
    cause: Outage, unplugging, PSU failure.
    effect: With the phases left open, resistance disappears within tens of ms (only drum inertia remains) and the user lurches. With the phases shorted, braking is proportional to speed.
    severity: S3
    evidence: [{case: power_loss_open_mid_pull, metric: peak_hand_deviation_after_fault_m}, {case: power_loss_shorted_mid_pull, metric: peak_hand_deviation_after_fault_m}, {case: power_loss_shorted_mid_pull, metric: peak_tension_after_fault_lbf}]
    mitigations: [Normally-closed phase-short relay on power loss (independent-hardware, simulated as upper bound), Hold-up energy for a controlled ramp-down (independent-hardware, not designed)]
    channel: independent-hardware
    validation_gap: Shorted-phase braking ignores winding inductance (upper bound). Relay timing and contact ratings are unknown.
    requirements: [R-06, R-09]
  - id: H-04
    title: Regenerative overvoltage
    cause: Braking resistor or chopper missing, failed or undersized. The supply cannot absorb energy.
    effect: The bus passes 60 V within a fraction of a second of a heavy pull, which can destroy the electronics and leave torque uncontrolled.
    severity: S3
    evidence: [{case: regen_no_dump_resistor, metric: time_to_overvoltage_ms}, {case: regen_no_dump_resistor, metric: peak_bus_v}, {case: tracking_fast_reversal, metric: peak_bus_v}]
    mitigations: [Braking chopper and resistor sized for peak regen (independent-hardware, simulated), Hardware overvoltage crowbar or drive disable (independent-hardware, not designed), Energy buffer (independent-hardware, trade study)]
    channel: independent-hardware
    validation_gap: Fast reversals peak just under the 60 V line with the proposed resistor, so the margin is thin. Resistor thermal rating is not sized.
    requirements: [R-06, R-09]
  - id: H-05
    title: Supply undervoltage, torque dropout
    cause: Motor draw exceeds supply power while lowering heavy loads.
    effect: The drive locks out torque, so resistance is lost mid-rep.
    severity: S3
    evidence: [{case: tracking_heavy_tempo, metric: min_bus_v}, {case: regen_with_dump_resistor, metric: min_bus_v}]
    mitigations: [Larger supply or energy buffer (independent-hardware, trade study), Graceful torque derating before lockout (firmware, not simulated)]
    channel: independent-hardware
    validation_gap: Supply and buffer sizing are undecided, and the derating policy is undefined.
    requirements: [R-06]
  - id: H-06
    title: Stuck-on or runaway torque (controller crash, wrong sign)
    cause: Firmware hang, a wrong torque sign after a configuration error, or a drive fault.
    effect: Up to full stall tension, which is far above the commanded load, or the cable reels in toward the device.
    severity: S4
    evidence: []
    mitigations: [Independent watchdog that removes drive enable (independent-hardware, not designed), Independent tension and speed limits in a separate safety MCU or hardware comparator (independent-hardware, not designed), Torque-limited motor and gearing choice (mechanical; stall tension in structure.md)]
    channel: independent-hardware
    validation_gap: Not simulated yet. Needs a fault-injection case with frozen or inverted torque.
    requirements: [R-09]
  - id: H-07
    title: Encoder or speed-sensor failure
    cause: Encoder loss or a bad reading.
    effect: Friction and inertia compensation, the speed limiter and release detection all degrade or misbehave.
    severity: S3
    evidence: []
    mitigations: [Encoder plausibility checks against motor back-EMF (firmware, not designed)]
    channel: firmware
    validation_gap: Not simulated yet.
    requirements: [R-09]
  - id: H-08
    title: Motor overtemperature
    cause: Sustained high tension (500 lbf holds) or blocked cooling.
    effect: Winding damage, demagnetisation, torque loss.
    severity: S2
    evidence: []
    mitigations: [Thermal model in firmware plus winding thermistor (firmware), Duty-cycle limits on peak tension (firmware)]
    channel: firmware
    validation_gap: The thermal model uses placeholder thermal data (A-015); see thermal.md for time-at-500-lbf.
    requirements: [R-07]
  - id: H-09
    title: Cable or termination failure
    cause: Wear, fatigue, sharp bends at the fairlead, overload from snap loads.
    effect: Sudden release (as H-01, plus whipping cable).
    severity: S4
    evidence: [{case: release_at_500lbf, metric: peak_tension_lbf}]
    mitigations: [Rope rated at 5x design tension (mechanical; see structure.md), Bend radius and wear inspection rules (mechanical, not defined), Cable guard (mechanical, not designed)]
    channel: mechanical
    validation_gap: The rope is not selected, and the fatigue and bend-radius analysis is not done.
    requirements: [R-08]
  - id: H-10
    title: Anchor or mount failure
    cause: Wall or floor anchor pull-out, or an under-rated substrate.
    effect: The device detaches under load.
    severity: S4
    evidence: []
    mitigations: [Anchor bolts sized for stall plus snap loads (mechanical; first pass in structure.md), Rated mounting bracket and installation instructions (mechanical, not designed)]
    channel: mechanical
    validation_gap: Substrate and anchor types are undefined. Snap loads exceed the static stall case.
    requirements: [R-08]
  - id: H-11
    title: Slack cable and snap at low force
    cause: Reflected inertia overruns the user at low set tension, so the cable goes slack and then snaps taut.
    effect: Jerky resistance, impact loads, poor control below about 20 lbf.
    severity: S2
    evidence: [{case: tracking_low_force, metric: tracking_rms_error_pct}, {case: tracking_low_force, metric: peak_tension_lbf}]
    mitigations: [Lower reflected inertia (drivetrain choice), Better state estimation or higher-bandwidth sensing (firmware), Slack detection with speed-mode take-up (firmware, not simulated)]
    channel: firmware
    validation_gap: R-03 low-force control is currently not met in simulation.
    requirements: [R-03, R-04]
  - id: H-12
    title: Entanglement or pinch points
    cause: Fingers, hair or clothing reaching the drum, belts or fairlead.
    effect: Crushing, amputation, entanglement.
    severity: S4
    evidence: []
    mitigations: [Enclosure and guards on belts, drum and fairlead (mechanical, not designed), Speed and torque limits (firmware)]
    channel: mechanical
    validation_gap: The enclosure is not designed.
    requirements: [R-09]
  - id: H-13
    title: Stored electrical energy
    cause: The 2 F supercapacitor buffer (about 3.1 kJ at 56 V) or the bus capacitors stay charged after shutdown.
    effect: Shock, arc or burn during service, and high fault current into a shorted drive.
    severity: S3
    evidence: []
    mitigations: [Bleed resistors and a discharge indicator (independent-hardware, not designed)]
    channel: independent-hardware
    validation_gap: Bleed time, pre-charge, fusing and balancing are not designed. The buffer is sized in dynamics only.
    requirements: [R-06, R-09]
  - id: H-14
    title: Pull with nobody on the deck
    cause: Someone pulls the cable while standing beside the platform, or steps off during a set.
    effect: The pull is no longer reacted by body weight. The platform lifts or tips at low tension (see the platform report) and can strike the user.
    severity: S3
    evidence: []
    mitigations: [Deck presence sensing (load cells or mat switch) that enables tension above rest only when someone is on the deck (independent-hardware, not designed), Release detection drops tension when a user steps off (firmware, simulated for handle release only)]
    channel: independent-hardware
    validation_gap: Not simulated. Presence sensing and its threshold are undefined.
    requirements: [R-09, R-14]
